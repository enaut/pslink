[workspace]
resolver = "3"
members = ["ui", "web", "backend", "shared"]

[workspace.dependencies]
axum = { version = "0.8" }
axum_session = { version = "0.21" }
axum_session_auth = { version = "0.21" }
anyhow = { version = "1.0" }

dioxus = { version = "0.8.0-alpha.2" }
dioxus-fullstack = { version = "0.8.0-alpha.2" }
dioxus-server = { version = "0.8.0-alpha.2" }
ui = { path = "ui" }
backend = { path = "backend" }
pslink-shared = { path = "shared" }
dioxus-i18n = { version = "0.7.0-alpha.1" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
