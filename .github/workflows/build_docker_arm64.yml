name: Build and Push ARM64 Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to use (e.g., v1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to use (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build-arm64:
    name: Build and push ARM64 Docker image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      repo-owner: ${{ steps.lowercase_repo.outputs.repo-owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variable
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli@0.8.0-alpha.3 -y

      - name: Lowercase repository owner
        id: lowercase_repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "REPO_OWNER=${REPO_OWNER}" >> "$GITHUB_ENV"
          echo "repo-owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"

      - name: Create bundle
        run: dx bundle --release --platform web

      - name: Ensure binary is named pslink
        run: |
          if [ -f target/dx/pslink/release/web/server ]; then
            mv target/dx/pslink/release/web/server target/dx/pslink/release/web/pslink
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aarch64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/pslink:aarch64-latest
            ghcr.io/${{ env.REPO_OWNER }}/pslink:aarch64-${{ env.VERSION }}
