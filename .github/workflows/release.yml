name: Dioxus Fullstack App CI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        required: true
        description: Choose the version number to publish with. Must be a tag (ie v0.4.0)
        type: string

jobs:
  frontend-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli@0.8.0-alpha.3 -y

      - name: Build Dioxus frontend
        run: dx bundle --release --platform web

      - name: Ensure binary is named pslink
        run: |
          if [ -f target/dx/pslink/release/web/server ]; then
            mv target/dx/pslink/release/web/server target/dx/pslink/release/web/pslink
          fi

      - name: rename path
        run: mv target/dx/pslink/release/web target/dx/pslink/release/pslink

      - name: Create archive of build artifacts
        run: tar -czvf pslink-linux-x86_64-bundle.tgz -C target/dx/pslink/release pslink

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pslink-linux-x86_64-bundle.tgz
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          generate_release_notes: true

      - name: Upload artifacts (for non-tagged builds)
        uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: web-build
          path: target/dx/pslink/release/pslink